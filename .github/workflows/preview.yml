name: Preview

# The binaries of any branch, to try a change before tagging it: "Run
# workflow" in the Actions tab. Nothing is published; the Linux and Windows
# archives are attached to the run for 14 days, named after the commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      preview: true
