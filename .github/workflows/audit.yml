name: Audit

# Checks the dependencies against the RustSec advisory database. Runs when
# they change, and every week as well, since a new advisory can affect a
# crate that hasn't changed at all.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built from crates.io rather than taken from a third-party action.
      # Advisories that don't apply here are listed in .cargo/audit.toml.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
