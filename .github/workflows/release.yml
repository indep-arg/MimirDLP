name: Release

# A "vX.Y.Z" tag publishes that version: checked like any push, built for
# Linux and Windows, then released with both archives at once, so the
# release never shows up (or gets announced by the app) half done. A
# failed run is retried with "Re-run failed jobs".
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The app reads its own version from Cargo.toml and the interface
      # from package.json; a tag that disagrees with either is a mistake.
      - name: Tag, Cargo.toml and package.json agree
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a vX.Y.Z tag: $TAG"
            exit 1
          fi
          CARGO=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          NPM=$(node -p "require('./package.json').version")
          if [[ "${TAG#v}" != "$CARGO" || "${TAG#v}" != "$NPM" ]]; then
            echo "::error::$TAG, but Cargo.toml says $CARGO and package.json $NPM"
            exit 1
          fi
          echo "version=$CARGO" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token and attestations: the signed statement that each archive was
    # built here, from this commit.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.linux }}
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.windows }}
          path: release

      - name: Checksums
        working-directory: release
        run: |
          for file in osprey-*; do sha256sum "$file" > "$file.sha256"; done
          ls -l

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/${{ needs.build.outputs.linux }}
            release/${{ needs.build.outputs.windows }}

      # A re-run after the release was already created only replaces its
      # files.
      - name: Publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber osprey-*
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "Osprey $VERSION" osprey-*
          fi
