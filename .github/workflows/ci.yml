name: CI

# Runs on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project tracks current stable, so the runner's toolchain is
      # brought up to date rather than assumed. Clippy is not preinstalled.
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      # Reuses the dependency build between runs; the key covers Cargo.lock
      # and the toolchain, so an update rebuilds from scratch.
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes tests/engine_scenarios.rs, which rebuilds the argv of a
      # fixed set of scenarios and compares it with what each expects.
      - name: Tests
        run: cargo test --all-targets --locked

  # The Windows build can only be checked here: there is no Windows machine
  # in the loop. The unix only tests are cfg'd out and skipped.
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc --version

      # Reuses the dependency build between runs; the key covers Cargo.lock
      # and the toolchain, so an update rebuilds from scratch.
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked

      # build.rs embeds the icon and the version information in one
      # resource; if it went missing it would only show as a blank icon on
      # someone's desktop. The version fields come from that same resource.
      - name: Check the embedded icon and version
        shell: pwsh
        run: |
          $info = (Get-Item target/debug/mimirdlp.exe).VersionInfo
          if ($info.ProductName -ne 'MimirDLP') {
            Write-Error "The .exe has no version resource (ProductName: '$($info.ProductName)')"
            exit 1
          }
          "ProductName: $($info.ProductName), FileVersion: $($info.FileVersion)"
