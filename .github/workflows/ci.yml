name: CI

# Every push to main and every pull request, and the release workflow runs
# it again before building. Other branches are checked through their pull
# request only: Dependabot pushes branches here, and a push trigger ran
# each check twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request makes the run for the old one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the interface too, which typechecks it on the way.
      - uses: ./.github/actions/prepare
        with:
          components: clippy rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # crates/core/tests/engine_scenarios.rs among them: it rebuilds the
      # argv of a fixed set of scenarios and compares it with what each
      # expects.
      - name: Tests
        run: cargo test --workspace --all-targets --locked

  # Nobody develops on Windows, so this is where the Windows build is
  # checked. The tests that start a tool use the stand-in program and run
  # here too; the few about Unix file permissions are skipped.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Build
        run: npx tauri build --debug --no-bundle -- --locked

      # Opens the window and closes it like a user would, three times. A
      # crash at startup, a window that never shows, a close that hangs or
      # a process left behind fails the job. OSPREY_DEV_ACTION=none keeps
      # it from downloading the tools. Without a GPU on the runner, the
      # webview draws on the CPU.
      - name: Launch and close
        shell: pwsh
        env:
          OSPREY_DEV_ACTION: none
        run: ./scripts/stress-launch.ps1 -Exe target/debug/osprey.exe -Runs 3 -State cold -StartTimeoutSeconds 60
