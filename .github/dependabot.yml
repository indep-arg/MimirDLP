# The actions are pinned by commit SHA; Dependabot updates the SHA and its
# version comment together, in the workflows and in .github/actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The Rust dependencies. Compatible updates arrive grouped in one pull
  # request a month; a new major version gets one of its own, since it can
  # need code changes. Security updates are sent as soon as an advisory
  # appears, whatever the schedule.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: ["minor", "patch"]

  # The interface's dependencies (ui/), grouped the same way.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: ["minor", "patch"]
