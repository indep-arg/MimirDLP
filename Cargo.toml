[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop"]

[workspace.package]
version = "0.9.0"
edition = "2024"
# The oldest Rust that can build Osprey, kept close to the latest stable
# on purpose. Users get a prebuilt binary, and building from source only
# needs a current toolchain from rustup, so there is no reason to hold
# dependencies back for the older compilers some distros ship. Raise it
# when moving to a newer toolchain.
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/indep-arg/Osprey"

[profile.release]
# One binary people download by hand, so a slower build is a fair trade for
# a much smaller file.
lto = true
codegen-units = 1
strip = true
