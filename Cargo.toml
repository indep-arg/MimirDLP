[package]
name = "mimirdlp"
version = "0.4.0"
description = "A portable GUI around yt-dlp: Mimir's well of downloads."
edition = "2024"
# Tracks the current stable Rust, not an old floor. The application is
# handed out as a prebuilt binary, and anyone compiling it from source
# installs a toolchain with rustup, so holding back the whole dependency
# tree to suit an old distro package would buy nothing. Bump it whenever
# the toolchain in use moves on.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/indep-arg/MimirDLP"

[dependencies]
iced = { version = "0.14.0", features = ["image"] }
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "optimization"] }
pgp = { version = "0.20.0", default-features = false }
# The folder picker: the desktop's own dialog. On Linux through the XDG
# portal over D-Bus (pure Rust, no GTK), on Windows the native one.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rspolib = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
# The language the system is set to, for the default translation.
sys-locale = "0.3.2"
tar = { version = "0.4.46", default-features = false }
# Translations: gettext .po files (po/), embedded in the binary. rspolib
# parses them; tr supplies the tr!() macro and the translator registry.
tr = { version = "0.1.11", default-features = false }
ureq = "3.4.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# kill(2) on a process group, to stop yt-dlp along with what it started.
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# An activation token, so the browser or file manager that is opened comes
# to the front on Wayland (gui/open.rs). Already in the tree through iced,
# with these features, so nothing new is built or linked.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging"] }

[dev-dependencies]
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }
# tests/translations.rs reads the source to find every translatable text.
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", default-features = false, features = ["parsing"] }

[profile.release]
# One binary people download by hand, so a slower build is a fair trade for
# a much smaller file.
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
