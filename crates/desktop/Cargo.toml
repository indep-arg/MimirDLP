[package]
name = "osprey"
description = "Download videos and music from YouTube and many other sites."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
osprey-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
# The system's own file manager, player and browser, for "Show in folder",
# "Open the file" and the links of the About page.
tauri-plugin-opener = "2"
# The folder picker: the desktop's own dialog.
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# One window per copy of the app: two would overwrite each other's queue.
tauri-plugin-single-instance = "2"
